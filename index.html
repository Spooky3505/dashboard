  function cmOpen() {
    var f = $("cm-setup");
    f.hidden = !f.hidden;
    if (!f.hidden) {
      $("cm-key").value = (commute && commute.key) || "";
      $("cm-from").value = (commute && commute.fromLabel) || "";
      $("cm-to").value = (commute && commute.toLabel) || "";
      $("cm-key").focus();
    }
  }

  $("commute").addEventListener("click", cmOpen);

  // An overlay that can only be dismissed by the control that opened it is a
  // trap on a display people walk up to and poke at.
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") $("cm-setup").hidden = true;
  });

  document.addEventListener("click", function (ev) {
    var f = $("cm-setup");
    if (f.hidden) return;
    if (f.contains(ev.target) || ev.target.closest("#commute")) return;
    f.hidden = true;
  });

  $("cm-clear").addEventListener("click", function () {
    try { localStorage.removeItem(CM_KEY); } catch (e) { /* not fatal */ }
    commute = null;
    $("cm-setup").hidden = true;
    cmRender("unset");
  });

  $("cm-setup").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var key = $("cm-key").value.trim();
    var from = $("cm-from").value.trim();
    var to = $("cm-to").value.trim();

    [["cm-key", key], ["cm-from", from], ["cm-to", to]].forEach(function (p) {
      $(p[0]).classList.toggle("bad", !p[1]);
    });
    if (!key || !from || !to) return;

    $("cm-note").textContent = "Looking up addresses…";

    Promise.all([cmGeocode(key, from), cmGeocode(key, to)])
      .then(function (r) {
        commute = {
          key: key,
          from: { lat: r[0].lat, lon: r[0].lon },
          to:   { lat: r[1].lat, lon: r[1].lon },
          fromLabel: from,
          toLabel: r[1].label
        };
        cmSave(commute);
        $("cm-setup").hidden = true;
        $("cm-note").textContent = CM_NOTE;
        cmFetch();
      })
      .catch(function (e) {
        $("cm-note").textContent =
          /http 40[13]/.test(e.message) ? "That key was rejected by TomTom."
                                        : "Could not find one of those addresses.";
      });
  });

  var CM_NOTE = "Stored only in this browser — never sent to the repo or the published page.";
  $("cm-note").textContent = CM_NOTE;

  cmFetch();
  setInterval(cmFetch, CM_MS);

  // ---- location: the page default, overridable by the ZIP box ----
  var loc = DATA ? { zip: DATA.zip, lat: DATA.lat, lon: DATA.lon, place: DATA.place } : null;

  // sessionStorage, not localStorage, and the distinction is the point: opening
  // the page always starts at the default ZIP from data.js, while a ZIP typed
  // in survives the 5-minute auto-reload for as long as the tab stays open.
  // localStorage would make a one-off lookup stick permanently.
  // Access is guarded because storage throws rather than returning null on
  // some origins.
  function loadSaved() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveLoc(l) {
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify(l)); } catch (e) { /* not fatal */ }
  }

  var saved = loadSaved();
  if (saved && saved.lat !== undefined) loc = saved;

  function renderPlace() {
    if (!loc) return;
    $("place").textContent = loc.place || "";
    $("zip-input").value = loc.zip || "";

    // Google forbids framing its map — X-Frame-Options: SAMEORIGIN, verified
    // in a browser — and the one legacy endpoint that does frame carries no
    // traffic, with the old layer=t flag now inert. So this hands off to the
    // real thing instead of pretending to embed it. data=!5m1!1e1 is the
    // traffic layer; the map opens centred on whichever ZIP is set.
    if (loc.lat !== undefined && loc.lon !== undefined) {
      $("traffic").href = "https://www.google.com/maps/@" +
        loc.lat + "," + loc.lon + ",12z/data=!5m1!1e1";
    }
  }

  // zippopotam gives the actual ZIP centroid; Open-Meteo's geocoder only knows
  // the city, which for 30066 lands about six miles off. Precise first, then
  // fall back so a single third-party outage doesn't break the box.
  function resolveZip(zip) {
    return fetch("https://api.zippopotam.us/us/" + encodeURIComponent(zip))
      .then(function (r) {
        if (!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function (d) {
        var p = d.places[0];
        return {
          zip: zip,
          lat: parseFloat(p.latitude),
          lon: parseFloat(p.longitude),
          place: p["place name"] + ", " + p["state abbreviation"]
        };
      })
      .catch(function () {
        return fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&country=US&name="
                     + encodeURIComponent(zip))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.results || !d.results.length) throw new Error("not found");
            var r0 = d.results[0];
            return {
              zip: zip,
              lat: r0.latitude,
              lon: r0.longitude,
              place: r0.name + (r0.admin1 ? ", " + r0.admin1 : "")
            };
          });
      });
  }

  $("zip-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = $("zip-input");
    var zip = input.value.trim();
    if (!/^\d{5}$/.test(zip)) {
      input.classList.add("error");
      return;
    }
    input.classList.remove("error");
    input.blur();
    resolveZip(zip).then(function (l) {
      loc = l;
      saveLoc(l);
      renderPlace();
      weather();
      refreshNews();
    }).catch(function () {
      input.classList.add("error");
    });
  });

  $("zip-input").addEventListener("input", function () {
    this.classList.remove("error");
  });

  function weather() {
    if (!loc || loc.lat === undefined) return;
    var url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + encodeURIComponent(loc.lat)
      + "&longitude=" + encodeURIComponent(loc.lon)
      + "&current=temperature_2m,weather_code"
      + "&hourly=temperature_2m,apparent_temperature,precipitation_probability,"
      +   "weather_code,wind_speed_10m,wind_direction_10m"
      + "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset"
      + "&temperature_unit=fahrenheit&wind_speed_unit=mph"
      + "&timezone=auto&forecast_days=2";

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        $("wx-temp").textContent = Math.round(d.current.temperature_2m) + "°";
        $("wx-cond").textContent = WMO[d.current.weather_code] || "—";
        $("wx-icon").innerHTML = weatherIcon(d.current.weather_code);
        $("wx-range").textContent =
          "H " + Math.round(d.daily.temperature_2m_max[0]) + "°   " +
          "L " + Math.round(d.daily.temperature_2m_min[0]) + "°";
        applyNight(d.current.time, d.daily.sunrise[0], d.daily.sunset[0]);
        setClockZone(d.timezone);
        renderForecast(d);
      })
      .catch(function () {
        // offline: keep whatever is on screen rather than blanking it
        $("wx-cond").textContent = "Weather unavailable";
      });
  }
  // Publishes the card count to CSS. Widths themselves stay in the stylesheet
  // so the narrow breakpoint can override them.
  function layoutCards() {
    var host = document.querySelector(".cards");
    host.setAttribute("data-n", Math.min(host.querySelectorAll(".card").length, 3));
  }

  $("cal-back").addEventListener("click", function () { calShift(-1); });
  $("cal-fwd").addEventListener("click", function () { calShift(1); });
  $("cal-today").addEventListener("click", function () { calHome(); calTouched(); });

  $("rev").textContent = "rev " + REV + " · " + REV_DATE;

  layoutCards();
  applyMode();
  renderCalendar();
  renderPlace();
  trimAll();
  weather();
  refreshNews();

  // Late-settling content — web font swap, the favicon tiles, the forecast
  // strip appearing — each changes how much fits. The observer catches these,
  // but a couple of unconditional passes cost nothing and remove any
  // dependence on observer timing.
  [400, 1500, 4000].forEach(function (ms) { setTimeout(trimAll, ms); });
  setInterval(weather, WX_MS);
  setInterval(refreshNews, WX_MS);

  // Reloading is how the page stays current, but it also throws away whatever
  // month is being browsed. If the calendar is not on the default view the
  // reload waits and asks again — the idle timer will have restored the
  // default within two minutes of the last click, so this defers, never blocks.
  (function scheduleReload() {
    setTimeout(function () {
      if (calOffset !== 0 || calSel) { scheduleReload(); return; }
      location.reload();
    }, RELOAD_MS);
  })();
})();
</script>
</body>
</html>
