<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  /* Tokens — DESIGN-apple.md. Light surfaces by default. */
  :root {
    --canvas:        #ffffff;
    --parchment:     #f5f5f7;
    --card:          #ffffff;
    --hairline:      #e0e0e0;
    --ink:           #1d1d1f;
    --ink-muted:     #7a7a7a;
    --accent:        #0066cc;

    --font: system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    --pad-x: 80px;
  }

  /* Dark tiles — used after sunset. Same system, alternate surface. */
  html.night {
    --canvas:        #272729;
    --parchment:     #252527;
    --card:          #2a2a2c;
    --hairline:      rgba(255,255,255,0.08);
    --ink:           #ffffff;
    --ink-muted:     #cccccc;
    --accent:        #2997ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--parchment);
    display: grid;
    grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Hero band: light tile, edge to edge ---- */
  .hero {
    background: var(--canvas);
    padding: 48px var(--pad-x) 36px;
  }

  .hero-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  /* ---- ZIP entry ---- */
  .zipbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 12px;
  }

  .place {
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink-muted);
  }

  /* The one interactive element on the page, so it takes the system's pill
     input grammar — kept at caption size so it stays quiet on an ambient
     display rather than competing with the weather. */
  .zip-input {
    font-family: var(--font);
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    padding: 5px 12px;
    width: 5.5em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    outline: none;
  }

  .zip-input:focus { border-color: var(--accent); }

  .zip-input.error { border-color: var(--accent); color: var(--accent); }

  /* ---- Afternoon rain strip ---- */
  .forecast {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
  }

  .verdict {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    margin-bottom: 20px;
  }

  .hours {
    display: grid;
    gap: 8px;
  }

  .hr { text-align: center; }

  /* Past hours stay visible for context but recede. */
  .hr.past { opacity: 0.3; }

  .hr-h {
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  .hr-t {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.231px;
    font-variant-numeric: tabular-nums;
  }

  /* Rain chance escalates by contrast, then by the single accent — no second
     hue introduced. Nothing on this page is clickable, so the accent is free
     to carry emphasis rather than interactivity. */
  .hr-r {
    font-size: 17px;
    letter-spacing: -0.374px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
  }

  .hr-r.mid  { color: var(--ink); font-weight: 600; }
  .hr-r.high { color: var(--accent); font-weight: 600; }

  .time {
    font-size: clamp(88px, 12.5vw, 190px);
    font-weight: 600;
    line-height: 0.92;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.14;
    letter-spacing: 0.196px;
    color: var(--ink-muted);
    margin-top: 16px;
  }

  .wx { text-align: right; flex-shrink: 0; }

  .wx-temp {
    font-size: 56px;
    font-weight: 600;
    line-height: 1.07;
    letter-spacing: -0.28px;
    font-variant-numeric: tabular-nums;
  }

  .wx-cond {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    margin-top: 4px;
  }

  .wx-range {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--ink-muted);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- Card row: utility cards on parchment ---- */
  .cards {
    padding: 40px var(--pad-x) 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Cards take the slack, footer pins to the bottom. Without an explicit
       row template the implicit rows auto-size and leave dead space below. */
    grid-template-rows: 1fr auto;
    gap: 24px;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 24px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .card h2 {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .cards.single { grid-template-columns: 1fr; }

  .card ul { list-style: none; overflow: hidden; min-height: 0; }

  .card li {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    padding: 7px 0;
    border-top: 1px solid var(--hairline);
    display: flex;
    gap: 12px;
  }

  .card li:first-child { border-top: none; }

  .meta {
    color: var(--ink-muted);
    font-size: 14px;
    letter-spacing: -0.224px;
    flex-shrink: 0;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .empty { color: var(--ink-muted); font-size: 17px; letter-spacing: -0.374px; }

  /* ---- Footer ---- */
  .foot {
    grid-column: 1 / -1;
    font-size: 12px;
    line-height: 1.0;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    padding-top: 4px;
  }

  .stale { color: var(--accent); }

  @media (max-width: 1068px) {
    :root { --pad-x: 48px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
      <div class="wx">
        <div class="wx-temp" id="wx-temp">--°</div>
        <div class="wx-cond" id="wx-cond">&nbsp;</div>
        <div class="wx-range" id="wx-range">&nbsp;</div>
        <form class="zipbar" id="zip-form" autocomplete="off">
          <span class="place" id="place"></span>
          <input class="zip-input" id="zip-input" type="text" inputmode="numeric"
                 maxlength="5" placeholder="ZIP" aria-label="ZIP code for forecast">
        </form>
      </div>
    </div>
    <div class="forecast" id="forecast" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="hours" id="hours"></div>
    </div>
  </header>

  <main class="cards">
    <section class="card" id="todos-card">
      <h2>Todos</h2>
      <ul id="todos"><li class="empty">run refresh.sh</li></ul>
    </section>
    <section class="card">
      <h2>News</h2>
      <ul id="news"><li class="empty">run refresh.sh</li></ul>
    </section>
    <div class="foot">
      <span id="gen">no data.js</span>
      <span id="err"></span>
    </div>
  </main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.DASH_DATA || null;
  var RELOAD_MS = 5 * 60 * 1000;   // shorter than refresh.sh's 15 min, so a
                                   // reload always picks up a fresh data.js
  var WX_MS = 15 * 60 * 1000;
  var STALE_MS = 45 * 60 * 1000;
  var STORE_KEY = "dash.location";

  var $ = function (id) { return document.getElementById(id); };

  // ---- clock ----
  // Deliberately no timeZone: the clock is a wall clock for whoever is looking
  // at it. The forecast strip is the part that follows the chosen ZIP, and it
  // gets its hours from the API in that location's own time.
  var timeFmt = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  var dateFmt = new Intl.DateTimeFormat("en-GB", {
    weekday: "long", day: "numeric", month: "long"
  });

  function tick() {
    var now = new Date();
    $("time").textContent = timeFmt.format(now);
    $("date").textContent = dateFmt.format(now);
  }
  tick();
  setInterval(tick, 1000);

  // ---- lists ----
  function fill(el, items, render) {
    if (!items || !items.length) {
      el.innerHTML = '<li class="empty">Nothing here</li>';
      return;
    }
    el.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      render(li, it);
      el.appendChild(li);
    });
  }

  if (DATA) {
    // The published build ships no todos at all — drop the card rather than
    // show an empty box, and let news take the full width.
    if (!DATA.todos || !DATA.todos.length) {
      var tc = $("todos-card");
      if (tc) tc.remove();
      document.querySelector(".cards").classList.add("single");
    } else {
      fill($("todos"), DATA.todos, function (li, t) {
        li.textContent = t;
      });
    }

    fill($("news"), DATA.news, function (li, n) {
      var title = document.createElement("span");
      title.textContent = n.title;
      li.appendChild(title);
      if (n.age) {
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = n.age;
        li.appendChild(meta);
      }
    });

    var gen = new Date(DATA.generated);
    var age = Date.now() - gen.getTime();
    var genEl = $("gen");
    genEl.textContent = "Updated " + timeFmt.format(gen);
    if (age > STALE_MS) genEl.className = "stale";

    if (DATA.errors && DATA.errors.length) {
      $("err").textContent = DATA.errors.join(" · ");
      $("err").className = "stale";
    }
  }

  // ---- weather (Open-Meteo is CORS-open, so it works straight from file://) ----
  var WMO = {
    0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Rime fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
    56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Showers", 81: "Showers", 82: "Violent showers",
    85: "Snow showers", 86: "Snow showers",
    95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
  };

  function applyNight(sunrise, sunset) {
    if (!sunrise || !sunset) return;
    var now = new Date();
    var isNight = now < new Date(sunrise) || now >= new Date(sunset);
    document.documentElement.classList.toggle("night", isNight);
  }

  // Afternoon window, 12pm–9pm. Rain thresholds picked so the strip answers
  // "is outdoor play on tonight" at a glance rather than reporting numbers.
  var WIN_START = 12, WIN_END = 21;
  var PLAY_START = 16;              // the after-work hours the verdict judges
  var RAIN_MID = 25, RAIN_HIGH = 50;

  function hourLabel(h) {
    var v = h % 12;
    if (v === 0) v = 12;
    return v + (h >= 12 ? "p" : "a");
  }

  function renderForecast(d) {
    var H = d.hourly, times = H.time;
    // current.time is already in the location's timezone, so no conversion.
    var nowStr = d.current.time;
    var today = nowStr.slice(0, 10);
    var nowHour = parseInt(nowStr.slice(11, 13), 10);

    var dates = [];
    for (var i = 0; i < times.length; i++) {
      var dd = times[i].slice(0, 10);
      if (dates.indexOf(dd) < 0) dates.push(dd);
    }
    // Once the window has passed there is nothing actionable left today,
    // so roll forward rather than show a full row of dead hours.
    var target = (nowHour >= WIN_END) ? (dates[1] || dates[0]) : dates[0];
    var isToday = target === today;

    var rows = [];
    for (var j = 0; j < times.length; j++) {
      if (times[j].slice(0, 10) !== target) continue;
      var hr = parseInt(times[j].slice(11, 13), 10);
      if (hr < WIN_START || hr > WIN_END) continue;
      rows.push({ hour: hr, temp: H.temperature_2m[j], prob: H.precipitation_probability[j] });
    }
    if (!rows.length) return;

    var host = $("hours");
    host.innerHTML = "";
    host.style.gridTemplateColumns = "repeat(" + rows.length + ", 1fr)";

    rows.forEach(function (r) {
      var cell = document.createElement("div");
      cell.className = "hr" + (isToday && r.hour < nowHour ? " past" : "");

      var h = document.createElement("div");
      h.className = "hr-h";
      h.textContent = hourLabel(r.hour);

      var t = document.createElement("div");
      t.className = "hr-t";
      t.textContent = Math.round(r.temp) + "°";

      var p = document.createElement("div");
      p.className = "hr-r" + (r.prob >= RAIN_HIGH ? " high" : r.prob >= RAIN_MID ? " mid" : "");
      p.textContent = r.prob + "%";

      cell.appendChild(h);
      cell.appendChild(t);
      cell.appendChild(p);
      host.appendChild(cell);
    });

    // The strip shows the whole afternoon, but the verdict speaks only to the
    // after-work hours — that's the decision being made. Judging the full
    // window instead produces true-but-useless readings like "dry until 1p"
    // on an evening that's 70% rain.
    var play = rows.filter(function (r) {
      return r.hour >= PLAY_START && (!isToday || r.hour >= nowHour);
    });
    if (!play.length) {
      play = rows.filter(function (r) { return r.hour >= PLAY_START; });
    }
    if (!play.length) play = rows;

    var peak = 0, firstRisk = null;
    play.forEach(function (r) {
      if (r.prob > peak) peak = r.prob;
      if (firstRisk === null && r.prob >= RAIN_MID) firstRisk = r.hour;
    });

    var msg;
    if (firstRisk === null) {
      msg = "Good for evening play — dry through " + hourLabel(WIN_END);
    } else if (firstRisk === play[0].hour) {
      msg = "Wet evening — rain chance up to " + peak + "%";
    } else {
      msg = "Dry until " + hourLabel(firstRisk) + ", then up to " + peak + "%";
    }

    $("verdict").textContent = (isToday ? "" : "Tomorrow: ") + msg;
    $("forecast").hidden = false;
  }

  // ---- location: the page default, overridable by the ZIP box ----
  var loc = DATA ? { zip: DATA.zip, lat: DATA.lat, lon: DATA.lon, place: DATA.place } : null;

  // localStorage is unavailable on some origins (notably file:// in some
  // browsers) and throws rather than returning null, so every access is guarded.
  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveLoc(l) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(l)); } catch (e) { /* not fatal */ }
  }

  var saved = loadSaved();
  if (saved && saved.lat !== undefined) loc = saved;

  function renderPlace() {
    if (!loc) return;
    $("place").textContent = loc.place || "";
    $("zip-input").value = loc.zip || "";
  }

  // zippopotam gives the actual ZIP centroid; Open-Meteo's geocoder only knows
  // the city, which for 30066 lands about six miles off. Precise first, then
  // fall back so a single third-party outage doesn't break the box.
  function resolveZip(zip) {
    return fetch("https://api.zippopotam.us/us/" + encodeURIComponent(zip))
      .then(function (r) {
        if (!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function (d) {
        var p = d.places[0];
        return {
          zip: zip,
          lat: parseFloat(p.latitude),
          lon: parseFloat(p.longitude),
          place: p["place name"] + ", " + p["state abbreviation"]
        };
      })
      .catch(function () {
        return fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&country=US&name="
                     + encodeURIComponent(zip))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.results || !d.results.length) throw new Error("not found");
            var r0 = d.results[0];
            return {
              zip: zip,
              lat: r0.latitude,
              lon: r0.longitude,
              place: r0.name + (r0.admin1 ? ", " + r0.admin1 : "")
            };
          });
      });
  }

  $("zip-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = $("zip-input");
    var zip = input.value.trim();
    if (!/^\d{5}$/.test(zip)) {
      input.classList.add("error");
      return;
    }
    input.classList.remove("error");
    input.blur();
    resolveZip(zip).then(function (l) {
      loc = l;
      saveLoc(l);
      renderPlace();
      weather();
    }).catch(function () {
      input.classList.add("error");
    });
  });

  $("zip-input").addEventListener("input", function () {
    this.classList.remove("error");
  });

  function weather() {
    if (!loc || loc.lat === undefined) return;
    var url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + encodeURIComponent(loc.lat)
      + "&longitude=" + encodeURIComponent(loc.lon)
      + "&current=temperature_2m,weather_code"
      + "&hourly=temperature_2m,precipitation_probability"
      + "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset"
      + "&temperature_unit=fahrenheit"
      + "&timezone=auto&forecast_days=2";

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        $("wx-temp").textContent = Math.round(d.current.temperature_2m) + "°";
        $("wx-cond").textContent = WMO[d.current.weather_code] || "—";
        $("wx-range").textContent =
          "H " + Math.round(d.daily.temperature_2m_max[0]) + "°   " +
          "L " + Math.round(d.daily.temperature_2m_min[0]) + "°";
        applyNight(d.daily.sunrise[0], d.daily.sunset[0]);
        renderForecast(d);
      })
      .catch(function () {
        // offline: keep whatever is on screen rather than blanking it
        $("wx-cond").textContent = "Weather unavailable";
      });
  }
  renderPlace();
  weather();
  setInterval(weather, WX_MS);

  setTimeout(function () { location.reload(); }, RELOAD_MS);
})();
</script>
</body>
</html>
