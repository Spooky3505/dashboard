<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  /* Tokens — DESIGN-apple.md. Light surfaces by default. */
  :root {
    --canvas:        #ffffff;
    --parchment:     #f5f5f7;
    --card:          #ffffff;
    --hairline:      #e0e0e0;
    --ink:           #1d1d1f;
    --ink-muted:     #7a7a7a;
    --accent:        #0066cc;

    --font: system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    --pad-x: 80px;

    /* Payday green / holiday yellow carry meaning from the source calendar's
       own legend, so they stay — but muted well below the original's
       saturation, which would shout on a display you sit next to all day. */
    --pay: #b7ddb0;
    --pay-ink: #1c3d17;
    --hol: #ffe9a3;
    --hol-ink: #4a3a00;

    /* Tint marking the hours the verdict actually judges. */
    --band: rgba(0,102,204,0.70);
  }

  /* Dark tiles — used after sunset. Same system, alternate surface. */
  html.night {
    --canvas:        #272729;
    --parchment:     #252527;
    --card:          #2a2a2c;
    --hairline:      rgba(255,255,255,0.08);
    --ink:           #ffffff;
    --ink-muted:     #cccccc;
    --accent:        #2997ff;

    --pay: #2f5c2a;
    --pay-ink: #cdeec7;
    --hol: #6b5405;
    --hol-ink: #ffe9a3;

    --band: rgba(41,151,255,0.85);
  }

  /* Photo mode rides on top of the dark token set (it is always applied with
     .night) and only re-points the surfaces: the background is the NASA image,
     so every panel has to become translucent or it would simply cover it. */
  html.photo {
    /* Fully transparent, not merely tinted: the hero band is the largest
       uninterrupted area of the page and any wash over it flattens the
       picture where it is most visible. The scrim gradient and the text
       shadow together carry legibility here — nothing else needs to. */
    --canvas:    transparent;
    --parchment: transparent;
    --card:      transparent;
    --hairline:  rgba(255,255,255,0.26);

    /* Muted text is raised in photo mode. Measured against a worst-case bright
       picture, #cccccc came out at 1.95:1 — unreadable. This is 4.8:1 behind
       the card filter below, where the same grey was 3.8. */
    --ink-muted: #e8e8e8;
  }

  html.photo body { background: transparent; }

  /* Text over an astrophotograph needs its own contrast floor. With the cards
     this transparent the scrim alone is not enough — the shadow is doing real
     work here, not decoration, and it is what lets the panels stay this light
     without the type breaking up over a bright patch of sky. */
  /* A halo, not a drop shadow. With the panels fully transparent this is the
     only thing separating a glyph from whatever pixel happens to be behind
     it, so it is tight and opaque close in, then falls off — it has to lift
     contrast at the glyph edge without visibly clouding the picture. */
  html.photo .hero, html.photo .card, html.photo .foot {
    text-shadow:
      0 1px 2px rgba(0,0,0,0.95),
      0 0 4px rgba(0,0,0,0.85),
      0 0 11px rgba(0,0,0,0.65);
  }

  /* Completely transparent: no fill and no backdrop filter, so a panel is
     optically identical to the picture around it. Only the hairline encloses
     it. A filter here — even a pure brightness one — is what made the cards
     read as darker rectangles laid over the image.

     Legibility therefore cannot come from the panels. It comes from two
     things that do not single them out: the page-wide scrim below, which
     treats every pixel alike, and the text halo, which darkens only the few
     pixels around each glyph. */
  html.photo .card {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  /* The accent measured 1.04:1 against a bright frame — effectively invisible.
     In photo mode the label takes the body colour and the band's tint is left
     to carry the accent on its own. */
  html.photo .play-label { color: var(--ink); }

  /* In photo mode the picture already separates the hero from the cards, and
     a rule drawn edge to edge across it reads as a scratch on the image. */
  html.photo .forecast { border-top: none; }

  /* Same problem, same fix: the selected-day line keeps a blue cast so it
     still reads as a different kind of statement from the countdowns, but
     pale enough to clear AA (4.8:1) behind the card filter. */
  html.photo .cal-detail { color: #cfe6ff; }

  #bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #000;
    background-size: cover;
    background-position: center;
    display: none;
  }

  html.photo #bg { display: block; }

  /* Scrim: without it, body copy sits directly on a nebula and is unreadable.
     Weighted to the top and bottom, where the text actually is.

     The brightness filter is what makes this adapt to the picture. A fixed
     wash is tuned for one image and the APOD swings from a near-black
     starfield to a full-frame bright nebula; tuned dark enough for the worst
     case it buries the good ones. brightness() is multiplicative, so it scales
     with whatever is actually there — a bright frame loses far more absolute
     luminance than a dark one, which is the behaviour wanted.

     It has to work this way because the pixels cannot be read: apod.nasa.gov
     sends no access-control-allow-origin, so drawing the image to a canvas
     taints it and getImageData throws. Measuring the average luminance in
     script is not available; a compositing filter needs no such access. */
  #bg::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: brightness(0.55) saturate(1.06);
    -webkit-backdrop-filter: brightness(0.55) saturate(1.06);
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.18) 38%,
        rgba(0,0,0,0.24) 72%, rgba(0,0,0,0.44) 100%);
  }

  /* The credit is a footer item, not a floating one. Pinned to the corner it
     was a third scrap of text along the bottom edge, competing with the
     revision label it sat directly beneath. In the footer the three read as
     one line. */
  /* Roughly doubles the wash. White body text goes from 4.19:1 to about
     7.5:1 against a worst-case bright frame; the picture is still legible as
     a picture, just quieter. */
  html.photo.dim #bg::after {
    backdrop-filter: brightness(0.34) saturate(1.06);
    -webkit-backdrop-filter: brightness(0.34) saturate(1.06);
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,0.46) 0%, rgba(0,0,0,0.34) 38%,
        rgba(0,0,0,0.38) 72%, rgba(0,0,0,0.56) 100%);
  }

  #bg-credit {
    max-width: 46%;
    text-align: right;
    display: none;
  }

  html.photo #bg-credit { display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--parchment);
    display: grid;
    grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Hero band: light tile, edge to edge ---- */
  /* Padding is deliberately tight. The hero has to share a ~900px-tall laptop
     display with two cards whose content is all essential, and the hourly
     strip grew when the icons landed — every pixel spent here was coming
     straight out of the calendar's legend. */
  .hero {
    background: var(--canvas);
    padding: 26px var(--pad-x) 22px;
  }

  .hero-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  /* ---- ZIP entry ---- */
  .zipbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
  }

  /* ---- Appearance toggle ---- */
  .mode-btn {
    font-family: var(--font);
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    padding: 5px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    outline: none;
  }

  .mode-btn:focus-visible { border-color: var(--accent); }
  .mode-btn .mode-ic { font-size: 13px; line-height: 1; }

  /* Marked as leaving the page, because it does — this is the one control that
     opens something else rather than changing what is on screen. */
  .mode-btn.ext { text-decoration: none; }
  .mode-btn .ext-ar { font-size: 11px; opacity: 0.7; margin-left: 1px; }

  .place {
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink-muted);
  }

  /* The one interactive element on the page, so it takes the system's pill
     input grammar — kept at caption size so it stays quiet on an ambient
     display rather than competing with the weather. */
  .zip-input {
    font-family: var(--font);
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    padding: 5px 12px;
    width: 5.5em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    outline: none;
  }

  .zip-input:focus { border-color: var(--accent); }

  .zip-input.error { border-color: var(--accent); color: var(--accent); }

  /* ---- Afternoon rain strip ---- */
  .forecast {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
  }

  /* The verdict answers "can I play tonight"; the commute answers "how long to
     get there". Same kind of statement, so they share a line — and the space
     to the verdict's right was empty anyway. */
  .verdict-row {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 12px;
  }

  .verdict {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
  }

  /* ---- Commute ---- */
  .commute {
    font-family: var(--font);
    font-size: 17px;
    letter-spacing: -0.374px;
    line-height: 1.2;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    text-align: right;
    white-space: nowrap;
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  .commute:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .commute .cm-mins { font-weight: 600; color: var(--ink); }
  .commute .cm-lbl { opacity: 0.75; }

  /* Delay is the whole point of asking, so it is the only part that colours.
     Free-flow gets no badge at all rather than a green one — a badge that is
     always present stops being read. */
  .commute .cm-delay { font-weight: 600; margin-left: 6px; }
  .commute .cm-delay.mid  { color: var(--hol-ink); }
  .commute .cm-delay.high { color: var(--accent); }

  html.night .commute .cm-delay.mid { color: #ffd60a; }

  /* ---- Commute setup ---- */
  /* Floated, not inserted. Opening it inline added its height to the hero and
     pushed the calendar off the bottom of the screen — the same failure this
     layout has had twice before. As an overlay it costs the page no height at
     all, so nothing below it can be displaced. */
  .cm-setup {
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    z-index: 20;
    width: min(460px, 100%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.30);
    padding: 14px 16px;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    background: var(--card);
  }

  .cm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

  .cm-row label {
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    width: 84px;
    flex: none;
  }

  .cm-row input {
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 6px 10px;
    flex: 1;
    min-width: 0;
    outline: none;
  }

  .cm-row input:focus { border-color: var(--accent); }
  .cm-row input.bad { border-color: var(--accent); color: var(--accent); }

  .cm-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

  .cm-note {
    font-size: 11px;
    letter-spacing: -0.11px;
    color: var(--ink-muted);
    flex: 1;
    line-height: 1.35;
  }

  .cm-btn {
    font-family: var(--font);
    font-size: 13px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    padding: 5px 14px;
    cursor: pointer;
    flex: none;
  }

  .cm-btn.cm-primary { border-color: var(--accent); color: var(--accent); }
  .cm-setup[hidden] { display: none; }
  .commute[hidden] { display: none; }

  html.photo .cm-setup { background: rgba(20,20,22,0.55); }
  html.photo .cm-row input, html.photo .cm-btn { background: rgba(0,0,0,0.35); }

  /* Two rows: the band's label, then the hours. No column gap — the cells
     have to touch for the play-window tint to read as one continuous band
     rather than a row of separate boxes. Their own padding does the spacing. */
  .hours {
    display: grid;
    gap: 0;
    grid-template-rows: auto auto;
  }

  .hr {
    grid-row: 2;
    text-align: center;
    padding: 7px 3px 5px;
  }

  /* Past hours stay visible for context but recede. */
  .hr.past { opacity: 0.3; }

  /* The strip shows the whole afternoon but the verdict speaks only to the
     hours after work. That scope was invisible — this marks it.

     A rule beneath the cells rather than a tint behind them. Once every panel
     on the page went transparent, a filled rectangle here was the only opaque
     element left, and it sat over the brightest part of the picture. A 2px
     underline carries the same meaning and adds no area. */
  .hr.play { box-shadow: inset 0 -2px 0 var(--band); }

  .play-label {
    grid-row: 1;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 0 0 4px 10px;
    align-self: end;
  }

  .hr-h {
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }

  /* Feels-like is the headline number and the air temperature the footnote,
     not the other way round. In Georgia the gap runs to ten degrees, and the
     one you would act on is the larger. */
  .hr-t {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.231px;
    font-variant-numeric: tabular-nums;
  }

  .hr-f {
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* Rain and wind take a line each. Spelling the wind out ("12 mph W") made
     the single combined row wider than the column, and the text bled into the
     neighbouring hour. Two short lines fit where one long one did not. */
  .hr-b {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .hr-w {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-top: 2px;
    font-size: 11px;
    letter-spacing: -0.11px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .hr-b .wind-ar, .hr-w .wind-ar { display: inline-block; }

  /* ---- Animated weather icons ---- */
  /* Fluid: a fixed 34px icon inside a 184px cell at a 2000px viewport looked
     abandoned. Clamped so it never outgrows a narrow column either. */
  .ic {
    width: clamp(32px, 2.9vw, 52px);
    height: clamp(32px, 2.9vw, 52px);
    display: block;
    margin: 0 auto;
  }

  :root {
    --i-sun:   #f5a623;
    --i-cloud: #9aa0a6;
    --i-rain:  #2b7fd4;
    --i-snow:  #7fc4e8;
    --i-bolt:  #f0b429;
  }

  html.night {
    --i-sun:   #ffcf5c;
    --i-cloud: #b8bec7;
    --i-rain:  #52a8ff;
    --i-snow:  #a9dcf5;
    --i-bolt:  #ffd60a;
  }

  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes drift     { 0%,100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
  @keyframes fall      { 0% { transform: translateY(-5px); opacity: 0; }
                         25% { opacity: 1; }
                         100% { transform: translateY(7px); opacity: 0; } }
  @keyframes flakefall { 0% { transform: translateY(-4px); opacity: 0; }
                         30% { opacity: 1; }
                         100% { transform: translateY(8px); opacity: 0; } }
  @keyframes flash     { 0%,72%,100% { opacity: .25; } 78%,86% { opacity: 1; } }
  @keyframes slide     { 0%,100% { transform: translateX(-2.5px); } 50% { transform: translateX(2.5px); } }

  /* The origin has to be the centre of the sun the rays belong to, not the
     centre of the tile. On the partly-cloudy icon the sun sits up at 26,13,
     and spinning its rays about 20,20 swung them bodily around the cloud
     instead of turning them in place. */
  .ic .rays  { transform-origin: 20px 20px; animation: spin 14s linear infinite; }
  .ic .rays-pc { transform-origin: 26px 13px; }
  .ic .cloud { transform-origin: 50% 50%; animation: drift 7s ease-in-out infinite; }
  .ic .drop  { animation: fall 1.5s linear infinite; }
  .ic .flake { animation: flakefall 2.6s linear infinite; }
  .ic .bolt  { animation: flash 3.2s ease-in-out infinite; }
  .ic .haze  { animation: slide 6s ease-in-out infinite; }

  .ic .d2, .ic .f2 { animation-delay: .5s; }
  .ic .d3, .ic .f3 { animation-delay: 1s; }
  .ic .h2 { animation-delay: .9s; }

  /* An ambient display runs all day; honour a viewer who has asked for calm.
     Transitions count too — the favicon fade was still running under reduced
     motion because this rule originally named only `animation`. It went
     unnoticed because the fade is a quarter of a second and whether it shows
     up depends on exactly when you look. */
  @media (prefers-reduced-motion: reduce) {
    .ic * { animation: none !important; }
    .thumb img { transition: none !important; }
  }

  /* Rain chance escalates by contrast, then by the single accent — no second
     hue introduced. Nothing on this page is clickable, so the accent is free
     to carry emphasis rather than interactivity. */
  .hr-r {
    font-size: 17px;
    letter-spacing: -0.374px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
  }

  .hr-r.mid  { color: var(--ink); font-weight: 600; }
  .hr-r.high { color: var(--accent); font-weight: 600; }

  .time {
    font-size: clamp(72px, 10vw, 142px);
    font-weight: 600;
    line-height: 0.92;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* AM/PM rides at a fraction of the clock's size. At the display size the
     hour is set in, a full-height "PM" would read as part of the number. */
  .time .ampm {
    font-size: 0.28em;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-muted);
    margin-left: 0.12em;
    vertical-align: 0.9em;
  }

  .date {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.14;
    letter-spacing: 0.196px;
    color: var(--ink-muted);
    margin-top: 10px;
  }

  .wx { text-align: right; flex-shrink: 0; }

  /* Icon sits beside the temperature, not above it — stacking it would add
     ~70px of hero height, which is exactly the budget the cards below need. */
  .wx-now {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
  }

  .wx-now .ic { width: 64px; height: 64px; margin: 0; flex: none; }

  .wx-temp {
    font-size: 56px;
    font-weight: 600;
    line-height: 1.07;
    letter-spacing: -0.28px;
    font-variant-numeric: tabular-nums;
  }

  .wx-cond {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    margin-top: 2px;
  }

  .wx-range {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--ink-muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- Card row: utility cards on parchment ---- */
  .cards {
    padding: 20px var(--pad-x) 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Cards take the slack, footer pins to the bottom. Without an explicit
       row template the implicit rows auto-size and leave dead space below. */
    grid-template-rows: 1fr auto;
    gap: 24px;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 18px 20px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .card h2 {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  /* Only the calendar's heading carries controls, so only it becomes a flex
     row. Applying this to every card heading pushed the news card's place
     name to the far right, away from the word it qualifies. */
  #cal-card h2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* ---- Calendar month navigation ---- */
  .cal-nav { display: flex; align-items: center; gap: 2px; }

  .cal-nav button {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1;
    color: var(--ink-muted);
    background: none;
    border: none;
    border-radius: 6px;
    padding: 3px 7px;
    cursor: pointer;
    letter-spacing: 0;
  }

  .cal-nav button:hover { color: var(--ink); background: var(--hairline); }
  .cal-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Only appears once you have navigated away, so the way back is offered
     exactly when it is needed and costs nothing when it is not. */
  #cal-today {
    font-size: 11px;
    text-transform: none;
    letter-spacing: -0.1px;
    padding: 3px 8px;
  }

  #cal-today[hidden] { display: none; }

  .scope { font-weight: 400; opacity: 0.7; }
  .scope:not(:empty)::before { content: "· "; }

  /* ---- Calendar ---- */
  .cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .cal-dow {
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    text-align: center;
    padding-bottom: 6px;
  }

  .cal-d {
    position: relative;
    text-align: center;
    font-size: 15px;
    line-height: 1;
    padding: 6px 0;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  .cal-d.pad { visibility: hidden; }
  .cal-d.pay { background: var(--pay); color: var(--pay-ink); font-weight: 600; }
  .cal-d.hol { background: var(--hol); color: var(--hol-ink); font-weight: 600; }

  /* Payday landing on a holiday happens twice a year. Green fill wins and the
     holiday adds a dot, so neither fact is lost. Needs the three-class
     selector: .hol alone would otherwise beat .pay on source order and the
     yellow dot would sit invisibly on a yellow cell. */
  .cal-d.pay.hol { background: var(--pay); color: var(--pay-ink); }

  .cal-d.pay.hol::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 3px;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--hol);
  }

  /* Outline rather than a fill, so today reads as today without erasing
     whatever else that day is. */
  .cal-d.today {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    font-weight: 600;
  }

  /* The calendar grid may shrink; the countdown and the legend may not. They
     are the answer the card exists to give, and they were the first things to
     be pushed off the bottom of the screen when the hero grew. */
  .cal { flex: 0 1 auto; }

  .cal-next {
    margin-top: 12px;
    font-size: 15px;
    letter-spacing: -0.3px;
    line-height: 1.45;
    flex-shrink: 0;
  }

  .cal-next b { font-weight: 600; }
  .cal-next .muted { color: var(--ink-muted); }

  /* The slot is reserved whether or not a day is selected, so clicking one
     never reflows the card — on a layout this height-constrained, a line
     appearing from nowhere would push the legend off the bottom. */
  /* Styled deliberately unlike the countdown lines above it — accent colour,
     no bold date, no relative time. It answers a different question ("what is
     this day?") and should not look like another countdown. */
  .cal-detail {
    min-height: 1.5em;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.14px;
    line-height: 1.5;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Only days that have something to say are offered as targets. */
  .cal-d.pay, .cal-d.hol { cursor: pointer; }

  .cal-d.sel { outline: 2px dashed var(--ink-muted); outline-offset: -2px; }
  .cal-d.today.sel { outline: 2px solid var(--accent); }

  .cal-key {
    display: flex;
    gap: 14px;
    margin-top: auto;
    padding-top: 10px;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }

  .cal-key span { display: flex; align-items: center; gap: 5px; }

  .sw {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }

  .sw.pay { background: var(--pay); }
  .sw.hol { background: var(--hol); }

  /* Column widths live here rather than in an inline style, so the narrow
     breakpoint below can actually override them. An inline style silently
     won against the media query and left three columns crushed together. */
  .cards[data-n="1"] { grid-template-columns: 1fr; }
  .cards[data-n="2"] { grid-template-columns: 1fr 330px; }
  .cards[data-n="3"] { grid-template-columns: 1fr 1.25fr 330px; }

  /* flex-basis 0, not auto: the list takes exactly the space the card has left
     over, independent of how many headlines are in it. With `auto` the box
     resized as items were hidden, which made the ResizeObserver below chase
     its own tail. */
  .card ul { list-style: none; overflow: hidden; min-height: 0; flex: 1 1 0; }

  .card li {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    padding: 7px 0;
    border-top: 1px solid var(--hairline);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .card li:first-child { border-top: none; }

  /* Caps the line length. At 1440 the news card is already 49 characters wide
     — inside the comfortable 45-75 range — but on a wide external display the
     same card ran past 100 characters per line, which is past the point where
     the eye reliably finds the start of the next one. */
  .card li { max-width: 78ch; }

  /* A headline is either fully on screen or not shown at all. `hidden` alone
     loses to `display: flex` above, so it needs the override — without it the
     list clipped the last headline through the middle of its text. */
  .card li[hidden] { display: none !important; }

  /* ---- News thumbnails ---- */
  /* Google News strips images from its feed — no thumbnail, no enclosure, and
     the link is an opaque redirect, so there is no article image to be had.
     The publisher's favicon is the closest real picture available; the
     monogram tile behind it is what shows when the domain guess misses. */
  .thumb {
    position: relative;
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    color: #fff;
    text-shadow: none;
  }

  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #fff;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  /* Swapped in only once the favicon has actually decoded. Loading it the
     other way round flashes a broken-image glyph on a display that is on
     all day. */
  .thumb img.ok { opacity: 1; }

  /* Headlines are links now. They keep the body colour rather than taking a
     link colour — on an ambient display a wall of blue would read as noise,
     and the underline on hover is enough of an affordance for the rare moment
     someone actually walks up to it. */
  .headline {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }

  a.headline:hover { text-decoration: underline; }
  a.headline:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  /* The whole row is the target, not just the words. */
  .card li:has(a.headline) { cursor: pointer; }

  /* Beside the headline, not flushed to the far edge. Right-aligning it left
     a 363px void between a short headline and its own timestamp — measured at
     a 2000px viewport — and the eye had to cross the whole card to pair them. */
  .meta {
    color: var(--ink-muted);
    font-size: 14px;
    letter-spacing: -0.224px;
    flex-shrink: 0;
    margin-left: -4px;
    font-variant-numeric: tabular-nums;
  }

  .empty { color: var(--ink-muted); font-size: 17px; letter-spacing: -0.374px; }

  /* ---- Footer ---- */
  .foot {
    grid-column: 1 / -1;
    font-size: 12px;
    line-height: 1.0;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    padding-top: 4px;
  }

  .stale { color: var(--accent); }

  /* Two groups rather than four evenly spread items: what was updated on the
     left, what you are looking at on the right. */
  .foot #err { margin-right: auto; }
  .foot { gap: 16px; }

  /* Below the breakpoint the cards stack, and three of them no longer fit a
     viewport. The no-scroll lock is right for the full-size ambient display
     but here it just clipped the calendar off the bottom with no way to reach
     it, so narrow windows scroll and the cards take their natural height. */
  @media (max-width: 1068px) {
    :root { --pad-x: 48px; }

    html, body { height: auto; overflow: auto; }
    body { display: block; }

    .cards[data-n] {
      grid-template-columns: 1fr;
      grid-template-rows: none;
    }

    /* Nothing is height-capped down here, so the list shows every headline.
       flex-basis must go back to auto as well: with basis 0 in an auto-height
       card there is no free space to grow into, the list measured zero-high
       and every item was trimmed away. */
    .card ul { overflow: visible; flex: 0 0 auto; }

    /* The hero right-hand column has three rows of controls now; below this
       width it wraps rather than crushing the ZIP box. */
    .zipbar { flex-wrap: wrap; }
  }

  /* Past this width the columns keep growing but nothing inside them does, and
     the content drifts apart — ten hourly cells 184px wide holding a 34px icon
     and a two-digit number. Capping the measure by growing the side padding
     keeps the proportions that work at 1440. The background image is unaffected:
     it is fixed to the viewport, not to the content. */
  @media (min-width: 1800px) {
    :root { --pad-x: calc((100vw - 1700px) / 2); }
  }

  /* Height is what this layout actually runs out of, not width. A 1440x900
     laptop is ~900px fullscreen but only ~760–810 windowed once tabs, the URL
     bar and a bookmarks bar are accounted for — all of which are ordinary, not
     edge cases. Rather than fall back to scrolling there (on an always-on
     display nobody scrolls, so content below the fold is content lost), the
     hero gives up the space: a smaller clock, tighter padding, smaller icons.
     That is enough for the cards to keep every essential line. */
  @media (max-height: 860px) {
    .hero { padding: 16px var(--pad-x) 14px; }
    .time { font-size: clamp(56px, 7.5vw, 100px); }
    .date { font-size: 19px; margin-top: 6px; }
    .forecast { margin-top: 12px; padding-top: 11px; }
    .verdict { font-size: 19px; margin-bottom: 8px; }
    .hr-h { margin-bottom: 2px; }
    .hr-t { font-size: 19px; }
    .hr-b { margin-top: 4px; }
    .hr-r { margin-top: 4px; }
    .ic { width: 34px; height: 34px; }
    .wx-now .ic { width: 50px; height: 50px; }
    .wx-temp { font-size: 44px; }
    .wx-cond { font-size: 18px; }
    .wx-range { font-size: 15px; margin-top: 4px; }
    .zipbar { margin-top: 8px; }
    .cards { padding-top: 14px; }
    .card { padding: 14px 18px; }
    .card h2 { margin-bottom: 9px; }
  }

  /* Below this even the compressed hero cannot buy enough room, so scrolling
     is the honest fallback — reachable content beats hidden content. */
  @media (max-height: 620px) {
    html, body { height: auto; overflow: auto; }
    body { display: block; }
    .cards { grid-template-rows: none; }
    .card ul { overflow: visible; flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <div id="bg"></div>

  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
      <div class="wx">
        <div class="wx-now">
          <span id="wx-icon"></span>
          <div>
            <div class="wx-temp" id="wx-temp">--°</div>
            <div class="wx-cond" id="wx-cond">&nbsp;</div>
          </div>
        </div>
        <div class="wx-range" id="wx-range">&nbsp;</div>
        <form class="zipbar" id="zip-form" autocomplete="off">
          <button class="mode-btn" id="mode-btn" type="button" aria-label="Change appearance">
            <span class="mode-ic" id="mode-ic">☀</span><span id="mode-label">Auto</span>
          </button>
          <a class="mode-btn ext" id="traffic" target="_blank" rel="noopener noreferrer"
             title="Open Google Maps traffic for this area">Traffic<span class="ext-ar">↗</span></a>
          <span class="place" id="place"></span>
          <input class="zip-input" id="zip-input" type="text" inputmode="numeric"
                 maxlength="5" placeholder="ZIP" aria-label="ZIP code for forecast">
        </form>
      </div>
    </div>
    <div class="forecast" id="forecast" hidden>
      <div class="verdict-row">
        <div class="verdict" id="verdict"></div>
        <button type="button" class="commute" id="commute" hidden></button>
    <form class="cm-setup" id="cm-setup" hidden autocomplete="off">
      <div class="cm-row">
        <label for="cm-key">TomTom key</label>
        <input id="cm-key" type="text" spellcheck="false" placeholder="paste your API key">
      </div>
      <div class="cm-row">
        <label for="cm-from">From</label>
        <input id="cm-from" type="text" placeholder="home address or ZIP">
      </div>
      <div class="cm-row">
        <label for="cm-to">To</label>
        <input id="cm-to" type="text" placeholder="work address">
      </div>
      <div class="cm-actions">
        <span class="cm-note" id="cm-note">Stored only in this browser — never sent to the repo or the published page.</span>
        <button type="button" class="cm-btn" id="cm-clear">Clear</button>
        <button type="submit" class="cm-btn cm-primary">Save</button>
      </div>
    </form>
      </div>
      <div class="hours" id="hours"></div>
    </div>


  </header>

  <main class="cards">
    <section class="card" id="todos-card">
      <h2>Todos</h2>
      <ul id="todos"><li class="empty">run refresh.sh</li></ul>
    </section>
    <section class="card">
      <h2>News <span class="scope" id="news-scope"></span></h2>
      <ul id="news"><li class="empty">run refresh.sh</li></ul>
    </section>
    <section class="card" id="cal-card">
      <h2>
        <span>Calendar <span class="scope" id="cal-month"></span></span>
        <span class="cal-nav">
          <button type="button" id="cal-back" aria-label="Previous month">‹</button>
          <button type="button" id="cal-today" aria-label="Back to this month" hidden>Today</button>
          <button type="button" id="cal-fwd" aria-label="Next month">›</button>
        </span>
      </h2>
      <div class="cal" id="cal"></div>
      <div class="cal-next" id="cal-next"></div>
      <div class="cal-detail" id="cal-detail"></div>
      <div class="cal-key">
        <span><i class="sw pay"></i>Payday</span>
        <span><i class="sw hol"></i>Holiday</span>
      </div>
    </section>
    <div class="foot">
      <span id="gen">no data.js</span>
      <span id="err"></span>
      <span id="bg-credit"></span>
      <span id="rev"></span>
    </div>
  </main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.DASH_DATA || null;
  var RELOAD_MS = 5 * 60 * 1000;   // shorter than refresh.sh's 15 min, so a
                                   // reload always picks up a fresh data.js
  var WX_MS = 15 * 60 * 1000;
  var STALE_MS = 45 * 60 * 1000;
  var STORE_KEY = "dash.location";
  var MODE_KEY = "dash.mode";
  var APOD_KEY = "dash.apod";

  // Page revision. Bumped by hand whenever the layout or behaviour changes —
  // deliberately NOT derived from the git SHA, because the refresh workflow
  // commits data.js every 15 minutes and the number would churn without
  // anything visible having changed. REVISIONS.md maps each one to its commit.
  var REV = 15;
  var REV_DATE = "2026-07-28";

  var $ = function (id) { return document.getElementById(id); };

  // ---- clock ----
  // The clock follows the selected ZIP's timezone. It starts on the default
  // location's zone from data.js, then re-homes once the weather call comes
  // back — Open-Meteo returns the resolved zone alongside the forecast, so
  // this costs no extra request.
  var clockTZ = (DATA && DATA.tz) || undefined;
  var timeFmt, dateFmt, dayFmt, footFmt;

  function buildFormatters() {
    // hour: "numeric", not "2-digit" — 12-hour time is written "1:26 PM",
    // never "01:26 PM".
    timeFmt = new Intl.DateTimeFormat("en-US", {
      hour: "numeric", minute: "2-digit", hour12: true, timeZone: clockTZ
    });
    dateFmt = new Intl.DateTimeFormat("en-GB", {
      weekday: "long", day: "numeric", month: "long", timeZone: clockTZ
    });
    // Cached rather than built per call: todayParts() runs once a second.
    dayFmt = new Intl.DateTimeFormat("en-US", {
      year: "numeric", month: "2-digit", day: "2-digit", timeZone: clockTZ
    });
    footFmt = new Intl.DateTimeFormat("en-US", {
      hour: "numeric", minute: "2-digit", hour12: true, timeZone: clockTZ
    });
  }
  buildFormatters();

  // The clock is set at ~142px. Rendering "11:26 PM" as one string puts the
  // meridiem at that size too, where it reads as part of the number — so the
  // parts are split and AM/PM is styled down separately. formatToParts rather
  // than a string split: the position of the meridiem is a locale's business,
  // not something to hardcode.
  function renderClock(now) {
    var parts = timeFmt.formatToParts(now);
    var clock = "", period = "";
    parts.forEach(function (p) {
      if (p.type === "dayPeriod") period = p.value;
      else if (p.type === "hour" || p.type === "minute" || p.type === "literal") clock += p.value;
    });
    var el = $("time");
    el.textContent = clock.trim();
    if (period) {
      var sp = document.createElement("span");
      sp.className = "ampm";
      sp.textContent = period;
      el.appendChild(sp);
    }
  }

  // Tracks the rendered day so the calendar rolls over at midnight instead of
  // waiting for the next reload to notice.
  var shownDay = null;

  function tick() {
    var now = new Date();
    renderClock(now);
    $("date").textContent = dateFmt.format(now);

    var key = todayParts().key;
    if (shownDay !== null && key !== shownDay) renderCalendar();
    shownDay = key;
  }
  tick();
  setInterval(tick, 1000);

  function setClockZone(tz) {
    if (!tz || tz === clockTZ) return;
    clockTZ = tz;
    buildFormatters();
    tick();
    renderGen();
    renderCalendar();   // "today" is zone-dependent near midnight
  }

  // "Updated" reflects when data.js was written, shown in the clock's zone —
  // so it has to be re-rendered whenever the zone changes.
  function renderGen() {
    if (!DATA || !DATA.generated) return;
    var gen = new Date(DATA.generated);
    var genEl = $("gen");
    // Names what was updated. "Updated" alone read as though it covered the
    // whole page; the weather is fetched live and is never this old.
    genEl.textContent = "News updated " + footFmt.format(gen);
    genEl.className = (Date.now() - gen.getTime() > STALE_MS) ? "stale" : "";
  }

  // ---- lists ----
  function fill(el, items, render) {
    if (!items || !items.length) {
      el.innerHTML = '<li class="empty">Nothing here</li>';
      return;
    }
    el.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      render(li, it);
      el.appendChild(li);
    });
  }

  if (DATA) {
    // The published build ships no todos at all — drop the card rather than
    // show an empty box, and let news take the full width.
    if (!DATA.todos || !DATA.todos.length) {
      var tc = $("todos-card");
      if (tc) tc.remove();
    } else {
      fill($("todos"), DATA.todos, function (li, t) {
        li.textContent = t;
      });
    }

    renderNews(DATA.news);

    renderGen();

    if (DATA.errors && DATA.errors.length) {
      $("err").textContent = DATA.errors.join(" · ");
      $("err").className = "stale";
    }
  }

  // ---- weather (Open-Meteo is CORS-open, so it works straight from file://) ----
  var WMO = {
    0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Rime fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
    56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Showers", 81: "Showers", 82: "Violent showers",
    85: "Snow showers", 86: "Snow showers",
    95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
  };

  // ---- appearance: auto / light / dark / photo ----
  // The button cycles the three explicit modes; "auto" is the untouched
  // default and is what follows sunrise/sunset. Kept in localStorage, not
  // sessionStorage: a display preference has to survive both the 5-minute
  // location.reload() and closing the tab. (The ZIP deliberately does not —
  // different question, different answer.)
  var MODES = ["auto", "light", "dark", "photo", "photodim"];
  var MODE_UI = {
    auto:     { ic: "◑", label: "Auto"  },
    light:    { ic: "☀", label: "Light" },
    dark:     { ic: "☾", label: "Dark"  },
    photo:    { ic: "✦", label: "NASA"  },
    // The transparent panels are tuned for the dark space pictures the APOD
    // usually is. Perhaps one in ten is a bright full-frame nebula, and on
    // those the text starts to struggle. This is the answer to that: one more
    // press, a heavier scrim, the same layout.
    photodim: { ic: "✦", label: "NASA dim" }
  };

  var mode = "auto";
  try {
    var savedMode = localStorage.getItem(MODE_KEY);
    if (MODES.indexOf(savedMode) >= 0) mode = savedMode;
  } catch (e) { /* storage throws rather than returning null on some origins */ }

  var autoNight = false;   // last sunrise/sunset verdict, remembered so that
                           // switching back to auto doesn't wait for the next
                           // weather call to take effect

  function applyMode() {
    var root = document.documentElement;
    var isPhoto = (mode === "photo" || mode === "photodim");
    var dark = (mode === "dark") || isPhoto || (mode === "auto" && autoNight);
    root.classList.toggle("night", dark);
    root.classList.toggle("photo", isPhoto);
    root.classList.toggle("dim", mode === "photodim");

    var ui = MODE_UI[mode];
    $("mode-ic").textContent = ui.ic;
    $("mode-label").textContent = ui.label;
    $("mode-btn").setAttribute("aria-label", "Appearance: " + ui.label);

    if (isPhoto) loadApod();
  }

  $("mode-btn").addEventListener("click", function () {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) { /* not fatal */ }
    applyMode();
  });

  // ---- NASA Astronomy Picture of the Day ----
  // Cached by date in localStorage and fetched at most once a day. This is not
  // an optimisation: the page reloads itself every 5 minutes, and the DEMO_KEY
  // rate limit measured on the live endpoint was 10/hour — an uncached fetch
  // would exhaust the quota inside the first hour and the background would
  // then fail for the rest of the day.
  function apodCached() {
    try {
      var raw = localStorage.getItem(APOD_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function showApod(a) {
    if (!a || !a.img) return;
    $("bg").style.backgroundImage = 'url("' + a.img + '")';
    $("bg-credit").textContent =
      a.title + (a.credit ? " · " + a.credit : "") + " · NASA APOD";
  }

  var apodPending = false;

  function loadApod() {
    var todayKey = todayParts().key;
    var c = apodCached();
    if (c && c.day === todayKey) { showApod(c); return; }
    if (apodPending) return;
    apodPending = true;

    fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&thumbs=true")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // Roughly one APOD in fifteen is a video: there is no hdurl and `url`
        // is a player embed, which cannot be used as a background. NASA does
        // return a poster frame when thumbs=true, so use that; if even that is
        // missing, keep whatever image was cached from a previous day rather
        // than dropping to a black screen.
        // `url` (NASA's web-sized copy) rather than `hdurl`, on measurement:
        // today's hdurl is 7.10 MB against 0.16 MB — 45x the bytes for a
        // 5815px image on a 1440px display, re-decoded on every 5-minute
        // reload. It sits behind a darkening scrim and three blurred cards,
        // so the extra resolution buys almost nothing visible. Swap the two
        // here if you want maximum sharpness over a lighter page.
        var img = null;
        if (d.media_type === "image") img = d.url || d.hdurl;
        else if (d.thumbnail_url) img = d.thumbnail_url;
        if (!img) { if (c) showApod(c); return; }

        var rec = { day: todayKey, img: img, title: d.title || "", credit: d.copyright || "" };
        try { localStorage.setItem(APOD_KEY, JSON.stringify(rec)); } catch (e) { /* not fatal */ }
        showApod(rec);
      })
      .catch(function () {
        // Offline or rate-limited: a stale picture beats a black rectangle.
        if (c) showApod(c);
      })
      .then(function () { apodPending = false; });
  }

  // Open-Meteo returns sunrise/sunset as naive strings in the *location's*
  // zone ("2026-07-27T20:10"), and `new Date()` on those parses them in the
  // viewer's zone. Comparing a real instant against them put the page in dark
  // mode at 7pm Los Angeles time for a viewer in New York — broad daylight.
  // current.time is naive in the same zone, so compare the strings directly.
  //
  // This only records the verdict. Applying it is applyMode()'s job, because
  // weather() runs every 15 minutes and toggling the class directly here would
  // have overwritten a manually chosen mode within the quarter hour.
  function applyNight(nowLocal, sunrise, sunset) {
    if (!nowLocal || !sunrise || !sunset) return;
    autoNight = nowLocal < sunrise || nowLocal >= sunset;
    if (mode === "auto") applyMode();
  }

  // Afternoon window, 12pm–9pm. Rain thresholds picked so the strip answers
  // "is outdoor play on tonight" at a glance rather than reporting numbers.
  var WIN_START = 12, WIN_END = 21;
  var PLAY_START = 16;              // the after-work hours the verdict judges
  var RAIN_MID = 25, RAIN_HIGH = 50;

  function hourLabel(h) {
    var v = h % 12;
    if (v === 0) v = 12;
    return v + (h >= 12 ? "p" : "a");
  }

  // ---- animated weather icons ----
  // Inline SVG rather than an icon font or sprite sheet: the page has no build
  // step and no external requests, and the parts have to be individually
  // animatable (drops stagger, rays spin, the bolt flashes).
  // Eight rays evenly around the disc, generated rather than hand-written.
  // The partly-cloudy sun used to carry three rays clustered in a single
  // quadrant, so three quarters of it had no light at all — and spinning that
  // cluster made the light appear and disappear as it swung behind the cloud.
  // A sun needs rays all the way round; the cloud is drawn afterwards, so the
  // ones behind it are occluded naturally, which is what should happen.
  function sunRays(cx, cy, r1, r2, cls, w) {
    var s = '<g class="rays' + (cls ? " " + cls : "") + '" stroke="var(--i-sun)" ' +
            'stroke-width="' + w + '" stroke-linecap="round">';
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      var dx = Math.cos(a), dy = Math.sin(a);
      s += '<line x1="' + (cx + dx * r1).toFixed(2) + '" y1="' + (cy + dy * r1).toFixed(2) +
           '" x2="' + (cx + dx * r2).toFixed(2) + '" y2="' + (cy + dy * r2).toFixed(2) + '"/>';
    }
    return s + '</g>';
  }

  var SUN = sunRays(20, 20, 12, 17, "", 2.2);

  function cloudShape(cls, y) {
    return '<g class="cloud ' + cls + '" fill="var(--i-cloud)">' +
           '<circle cx="14" cy="' + (y + 3) + '" r="6.5"/>' +
           '<circle cx="23" cy="' + (y + 1) + '" r="8.5"/>' +
           '<rect x="11" y="' + (y + 3) + '" width="18.5" height="7.5" rx="3.75"/></g>';
  }

  function drops(n) {
    var s = '<g stroke="var(--i-rain)" stroke-width="2.4" stroke-linecap="round">';
    for (var i = 0; i < n; i++) {
      var x = 15 + i * 6;
      s += '<line class="drop d' + (i + 1) + '" x1="' + x + '" y1="29" x2="' + (x - 1.5) + '" y2="34"/>';
    }
    return s + '</g>';
  }

  function flakes(n) {
    var s = '<g fill="var(--i-snow)">';
    for (var i = 0; i < n; i++) {
      s += '<circle class="flake f' + (i + 1) + '" cx="' + (15 + i * 6) + '" cy="31" r="1.9"/>';
    }
    return s + '</g>';
  }

  function svg(inner) {
    return '<svg class="ic" viewBox="0 0 40 40" aria-hidden="true">' + inner + '</svg>';
  }

  function weatherIcon(code) {
    if (code === 0 || code === 1) {
      return svg(SUN + '<circle cx="20" cy="20" r="7.5" fill="var(--i-sun)"/>');
    }
    if (code === 2) {                       // partly cloudy: sun peeking out
      return svg(sunRays(26, 13, 7.6, 11, "rays-pc", 2) +
                 '<circle cx="26" cy="13" r="5.5" fill="var(--i-sun)"/>' + cloudShape("", 18));
    }
    if (code === 3) return svg(cloudShape("", 15));
    if (code === 45 || code === 48) {       // fog
      return svg(cloudShape("", 12) +
                 '<g stroke="var(--i-cloud)" stroke-width="2.2" stroke-linecap="round">' +
                 '<line class="haze" x1="10" y1="30" x2="30" y2="30"/>' +
                 '<line class="haze h2" x1="13" y1="35" x2="27" y2="35"/></g>');
    }
    if (code >= 95) {                       // thunderstorm
      // Every point must sit inside the 0 0 40 40 viewBox — an earlier version
      // ran to y=44 and the tail of the bolt was silently clipped away.
      return svg(cloudShape("", 12) +
                 '<polygon class="bolt" points="23,23 16,33.5 20.5,33.5 18,38.5 26,28.5 21.5,28.5 24.5,23" ' +
                 'fill="var(--i-bolt)"/>');
    }
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
      return svg(cloudShape("", 12) + flakes(3));
    }
    if (code >= 51) {                       // drizzle, rain, showers
      var heavy = (code === 65 || code === 67 || code === 82);
      return svg(cloudShape("", 12) + drops(heavy ? 4 : 3));
    }
    return svg(cloudShape("", 15));
  }

  // Meteorological direction is where the wind comes FROM; the arrow shows
  // where it is going, so it points 180° round.
  function windArrow(deg) {
    return '<span class="wind-ar" style="transform:rotate(' + ((deg + 180) % 360) + 'deg)">↑</span>';
  }

  // Meteorological convention: the direction names where the wind comes FROM,
  // which is the opposite of where the arrow above points.
  var COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
  var COMPASS_LONG = ["north","north-east","east","south-east",
                      "south","south-west","west","north-west"];

  function compassIdx(deg) {
    return Math.round(((deg % 360) + 360) % 360 / 45) % 8;
  }
  function compass(deg)     { return COMPASS[compassIdx(deg)]; }
  function compassName(deg) { return COMPASS_LONG[compassIdx(deg)]; }

  var DROP_SVG = '<svg width="9" height="11" viewBox="0 0 9 11" aria-hidden="true" style="flex:none">' +
                 '<path d="M4.5 0C4.5 0 0 5.2 0 7.2a4.5 4.5 0 0 0 9 0C9 5.2 4.5 0 4.5 0z" ' +
                 'fill="var(--i-rain)"/></svg>';

  function renderForecast(d) {
    var H = d.hourly, times = H.time;
    // current.time is already in the location's timezone, so no conversion.
    var nowStr = d.current.time;
    var today = nowStr.slice(0, 10);
    var nowHour = parseInt(nowStr.slice(11, 13), 10);

    var dates = [];
    for (var i = 0; i < times.length; i++) {
      var dd = times[i].slice(0, 10);
      if (dates.indexOf(dd) < 0) dates.push(dd);
    }
    // Once the window has passed there is nothing actionable left today,
    // so roll forward rather than show a full row of dead hours.
    var target = (nowHour >= WIN_END) ? (dates[1] || dates[0]) : dates[0];
    var isToday = target === today;

    var rows = [];
    for (var j = 0; j < times.length; j++) {
      if (times[j].slice(0, 10) !== target) continue;
      var hr = parseInt(times[j].slice(11, 13), 10);
      if (hr < WIN_START || hr > WIN_END) continue;
      rows.push({
        hour: hr,
        temp:  H.temperature_2m[j],
        feels: H.apparent_temperature ? H.apparent_temperature[j] : null,
        prob:  H.precipitation_probability[j],
        code:  H.weather_code ? H.weather_code[j] : 3,
        wind:  H.wind_speed_10m ? H.wind_speed_10m[j] : null,
        dir:   H.wind_direction_10m ? H.wind_direction_10m[j] : 0
      });
    }
    if (!rows.length) return;

    var host = $("hours");
    host.innerHTML = "";
    host.style.gridTemplateColumns = "repeat(" + rows.length + ", 1fr)";

    // First cell the verdict speaks for, so the band can start exactly there.
    var firstPlay = -1;
    rows.forEach(function (r, i) {
      if (firstPlay < 0 && r.hour >= PLAY_START) firstPlay = i;
    });

    rows.forEach(function (r, i) {
      var cell = document.createElement("div");
      var cls = "hr";
      if (isToday && r.hour < nowHour) cls += " past";
      if (firstPlay >= 0 && i >= firstPlay) {
        cls += " play";
        if (i === firstPlay) cls += " play-first";
        if (i === rows.length - 1) cls += " play-last";
      }
      cell.className = cls;

      var rainCls = r.prob >= RAIN_HIGH ? " high" : r.prob >= RAIN_MID ? " mid" : "";

      // Feels-like leads; the air temperature is the footnote. Where the two
      // agree there is nothing to footnote, so the second line is omitted
      // rather than repeating the same number twice.
      var feels = (r.feels === null) ? null : Math.round(r.feels);
      var air = Math.round(r.temp);
      var lead = (feels === null) ? air : feels;

      var html =
        '<div class="hr-h">' + hourLabel(r.hour) + '</div>' +
        weatherIcon(r.code) +
        '<div class="hr-t">' + lead + '°</div>';

      html += (feels !== null && feels !== air)
        ? '<div class="hr-f">air ' + air + '°</div>'
        : '<div class="hr-f">&nbsp;</div>';

      html += '<div class="hr-b">' + DROP_SVG +
              '<span class="hr-r' + rainCls + '">' + r.prob + '%</span></div>';

      if (r.wind !== null) {
        // "12 mph W" rather than a bare number beside an arrow — the arrow
        // alone left both the unit and the direction to be guessed at.
        html += '<div class="hr-w" title="Wind from the ' + compassName(r.dir) + '">' +
                windArrow(r.dir) +
                '<span>' + Math.round(r.wind) + ' mph ' + compass(r.dir) + '</span></div>';
      }

      cell.innerHTML = html;
      host.appendChild(cell);
    });

    // Label sits in the grid's first row, spanning from the band's first
    // column to the end, so it tracks the band without measuring anything.
    if (firstPlay > 0) {
      var lab = document.createElement("div");
      lab.className = "play-label";
      lab.style.gridColumn = (firstPlay + 1) + " / -1";
      lab.textContent = "After work";
      host.appendChild(lab);
    }

    // The strip shows the whole afternoon, but the verdict speaks only to the
    // after-work hours — that's the decision being made. Judging the full
    // window instead produces true-but-useless readings like "dry until 1p"
    // on an evening that's 70% rain.
    var play = rows.filter(function (r) {
      return r.hour >= PLAY_START && (!isToday || r.hour >= nowHour);
    });
    if (!play.length) {
      play = rows.filter(function (r) { return r.hour >= PLAY_START; });
    }
    if (!play.length) play = rows;

    var peak = 0, firstRisk = null;
    play.forEach(function (r) {
      if (r.prob > peak) peak = r.prob;
      if (firstRisk === null && r.prob >= RAIN_MID) firstRisk = r.hour;
    });

    var msg;
    if (firstRisk === null) {
      msg = "Good for evening play — dry through " + hourLabel(WIN_END);
    } else if (firstRisk === play[0].hour) {
      msg = "Wet evening — rain chance up to " + peak + "%";
    } else {
      msg = "Dry until " + hourLabel(firstRisk) + ", then up to " + peak + "%";
    }

    $("verdict").textContent = (isToday ? "" : "Tomorrow: ") + msg;
    $("forecast").hidden = false;
  }

  // ---- calendar: paydays and company holidays ----
  // Paydays are every other Friday. Anchored on a known one and derived by
  // arithmetic rather than a hardcoded list, so the schedule keeps working
  // past this year instead of silently going blank on 1 January.
  var PAY_ANCHOR = Date.UTC(2026, 0, 9);
  var DAY_MS = 86400000;

  function ymd(t) {
    var d = new Date(t);
    return d.getUTCFullYear() + "-" +
           String(d.getUTCMonth() + 1).padStart(2, "0") + "-" +
           String(d.getUTCDate()).padStart(2, "0");
  }

  function isPayday(t) {
    var diff = Math.round((t - PAY_ANCHOR) / DAY_MS);
    return ((diff % 14) + 14) % 14 === 0;
  }

  function nthWeekday(y, month, weekday, n) {
    var first = new Date(Date.UTC(y, month, 1));
    var shift = (weekday - first.getUTCDay() + 7) % 7;
    return Date.UTC(y, month, 1 + shift + (n - 1) * 7);
  }

  function lastWeekday(y, month, weekday) {
    var last = new Date(Date.UTC(y, month + 1, 0));
    var shift = (last.getUTCDay() - weekday + 7) % 7;
    return Date.UTC(y, month + 1, 0 - shift);
  }

  // Derived from rules, not a fixed list — same reason as the paydays.
  function holidaysFor(y) {
    var h = {};
    h[ymd(Date.UTC(y, 0, 1))] = "New Year's Day";
    h[ymd(nthWeekday(y, 0, 1, 3))] = "MLK Day";
    h[ymd(lastWeekday(y, 4, 1))] = "Memorial Day";

    // 4 July slides to the nearest weekday when it lands on one.
    var jul4 = new Date(Date.UTC(y, 6, 4));
    var obs = Date.UTC(y, 6, 4);
    if (jul4.getUTCDay() === 6) obs = Date.UTC(y, 6, 3);
    if (jul4.getUTCDay() === 0) obs = Date.UTC(y, 6, 5);
    h[ymd(obs)] = "Independence Day";

    h[ymd(nthWeekday(y, 8, 1, 1))] = "Labor Day";
    var tg = nthWeekday(y, 10, 4, 4);
    h[ymd(tg)] = "Thanksgiving";
    h[ymd(tg + DAY_MS)] = "Day after Thanksgiving";
    h[ymd(Date.UTC(y, 11, 24))] = "Christmas Eve";
    h[ymd(Date.UTC(y, 11, 25))] = "Christmas Day";
    h[ymd(Date.UTC(y, 11, 31))] = "New Year's Eve";
    return h;
  }

  var MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  var DOW = ["Su","M","Tu","W","Th","F","Sa"];

  // "Today" in the dashboard's current zone, so the highlight follows the ZIP
  // rather than the machine rendering the page. Uses formatToParts rather than
  // splitting a formatted string — relying on a locale to emit exactly
  // "YYYY-MM-DD" is an assumption about locale data, not a guarantee.
  function todayParts() {
    var p = dayFmt.formatToParts(new Date());
    var o = {};
    p.forEach(function (x) { if (x.type !== "literal") o[x.type] = x.value; });
    return { y: +o.year, m: +o.month - 1, d: +o.day,
             key: o.year + "-" + o.month + "-" + o.day };
  }

  // Months away from the real current month. Always starts at 0: the default
  // view is this month, every time the page is opened or reloaded.
  var calOffset = 0;
  var calSel = null;          // key of the day whose detail is showing
  var calIdleTimer = null;

  function calShift(n) {
    calOffset += n;
    calSel = null;
    renderCalendar();
    calTouched();
  }

  function calHome() {
    calOffset = 0;
    calSel = null;
    renderCalendar();
  }

  // Browsing pauses the snap-back. Without this the 5-minute auto-reload would
  // yank the view to the current month while someone was still reading
  // another one; with it, the view returns on its own once they walk away.
  function calTouched() {
    clearTimeout(calIdleTimer);
    if (calOffset === 0 && !calSel) return;
    calIdleTimer = setTimeout(calHome, 2 * 60 * 1000);
  }

  function renderCalendar() {
    var tp = todayParts();
    var todayKey = tp.key;

    // The grid follows the offset; "today" stays the real today, so its ring
    // simply does not appear in any other month.
    var shown = new Date(Date.UTC(tp.y, tp.m + calOffset, 1));
    var Y = shown.getUTCFullYear(), M = shown.getUTCMonth();
    var D = tp.d;

    var hol = holidaysFor(Y);
    var grid = $("cal");
    grid.innerHTML = "";

    DOW.forEach(function (d) {
      var el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    var firstDow = new Date(Date.UTC(Y, M, 1)).getUTCDay();
    var daysIn = new Date(Date.UTC(Y, M + 1, 0)).getUTCDate();

    for (var i = 0; i < firstDow; i++) {
      var pad = document.createElement("div");
      pad.className = "cal-d pad";
      pad.textContent = "0";
      grid.appendChild(pad);
    }

    for (var day = 1; day <= daysIn; day++) {
      var t = Date.UTC(Y, M, day);
      var key = ymd(t);
      var cell = document.createElement("div");
      var cls = "cal-d";
      var pay = isPayday(t);
      if (pay) cls += " pay";
      if (hol[key]) cls += " hol";
      if (key === todayKey) cls += " today";
      if (key === calSel) cls += " sel";
      cell.className = cls;
      cell.textContent = day;
      if (hol[key]) cell.title = hol[key];

      // Only days carrying a fact are clickable. Closing over the values
      // rather than reading them back off the element keeps the handler
      // honest if the markup ever changes.
      if (pay || hol[key]) {
        (function (k) {
          cell.addEventListener("click", function () {
            calSel = (calSel === k) ? null : k;   // clicking again closes it
            renderCalendar();
            calTouched();
          });
        })(key);
      }
      grid.appendChild(cell);
    }

    $("cal-month").textContent = MONTHS[M] + " " + Y;
    $("cal-today").hidden = (calOffset === 0);

    // Next payday and next holiday, counted from today inclusive.
    var todayT = Date.UTC(Y, M, D);
    var nextPay = todayT;
    while (!isPayday(nextPay)) nextPay += DAY_MS;

    var nextHolT = null, nextHolName = "";
    var horizon = holidaysFor(Y);
    var nextYear = holidaysFor(Y + 1);   // carries the search past 31 December
    Object.keys(nextYear).forEach(function (k) { horizon[k] = nextYear[k]; });
    Object.keys(horizon).sort().forEach(function (k) {
      if (nextHolT !== null) return;
      var p = k.split("-");
      var t2 = Date.UTC(+p[0], +p[1] - 1, +p[2]);
      if (t2 >= todayT) { nextHolT = t2; nextHolName = horizon[k]; }
    });

    function fmt(t) {
      return new Intl.DateTimeFormat("en-GB", {
        weekday: "short", day: "numeric", month: "short", timeZone: "UTC"
      }).format(new Date(t));
    }
    // Now that months can be browsed backwards, this gets asked about days in
    // the past, where "in -5 days" is what the naive version produced.
    function inDays(t) {
      var n = Math.round((t - todayT) / DAY_MS);
      if (n === 0) return "today";
      if (n === 1) return "tomorrow";
      if (n === -1) return "yesterday";
      return n > 0 ? "in " + n + " days" : Math.abs(n) + " days ago";
    }

    var out = "<div><b>Payday</b> " + fmt(nextPay) +
              " <span class=\"muted\">" + inDays(nextPay) + "</span></div>";
    if (nextHolT !== null) {
      out += "<div><b>" + nextHolName + "</b> " + fmt(nextHolT) +
             " <span class=\"muted\">" + inDays(nextHolT) + "</span></div>";
    }
    $("cal-next").innerHTML = out;

    // Detail for the selected day, derived from the key rather than carried
    // along from the click, so it survives the re-renders that happen on the
    // minute tick and on a timezone change.
    // Just the name. The date is not repeated here: you clicked the day, so
    // the grid above already says which one it is, and spelling it out put a
    // third line in the same shape as the two countdowns directly above —
    // three near-identical rows that had to be read to be told apart.
    var det = $("cal-detail");
    if (!calSel) {
      det.innerHTML = "";
    } else {
      var sp = calSel.split("-");
      var st = Date.UTC(+sp[0], +sp[1] - 1, +sp[2]);
      var names = [];
      var selHol = holidaysFor(+sp[0])[calSel];
      if (selHol) names.push(selHol);
      if (isPayday(st)) names.push("Payday");
      det.textContent = names.join(" · ");
    }
  }

  // ---- news ----
  function renderNews(items) {
    fill($("news"), items, function (li, n) {
      // data.js headlines (the build-time BBC fallback) carry no source, so
      // the split runs here rather than only in the live path.
      var src = n.source;
      var text = n.title;
      if (src === undefined) {
        var parts = splitTitle(n.title);
        text = parts.title;
        src = parts.source;
      }

      li.appendChild(thumbFor(src));

      // An anchor when there is somewhere to go, a plain span otherwise —
      // rather than a dead link that looks clickable and does nothing.
      var title;
      if (n.link) {
        title = document.createElement("a");
        title.href = n.link;
        title.target = "_blank";
        // noopener: the opened page must not get a handle back to this one.
        title.rel = "noopener noreferrer";
        // The row is a bigger target than the words, and on a display you walk
        // up to, that matters more than it would on a desktop app.
        li.addEventListener("click", function (ev) {
          if (ev.target.closest("a")) return;   // let the real link do its job
          window.open(n.link, "_blank", "noopener,noreferrer");
        });
      } else {
        title = document.createElement("span");
      }
      title.className = "headline";
      title.textContent = text;
      li.appendChild(title);

      if (n.age) {
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = n.age;
        li.appendChild(meta);
      }
    });
    trimList($("news"));
  }

  // A headline is shown whole or not at all. The list is height-capped by the
  // card, and CSS overflow would cut the last one through the middle of its
  // text — which is what was happening. Measuring is the only way to know how
  // many fit: it depends on the window, the ZIP (headline lengths differ) and
  // whether a headline wraps to two lines.
  function trimList(ul) {
    if (!ul) return;
    var items = ul.children, i;
    for (i = 0; i < items.length; i++) items[i].hidden = false;

    // Where the layout is not height-capped — the stacked breakpoints, which
    // scroll — the list is sized by its content and there is nothing to trim.
    // `overflow: visible` is the signal for that, set by the same media
    // queries that unlock scrolling. Without this check the list measured as
    // zero-height there and hid every single item.
    if (getComputedStyle(ul).overflowY === "visible") return;

    var limit = ul.getBoundingClientRect().bottom;
    for (i = 0; i < items.length; i++) {
      if (items[i].getBoundingClientRect().bottom > limit + 0.5) {
        // Everything after this one is lower still, so stop measuring.
        for (var j = i; j < items.length; j++) items[j].hidden = true;
        break;
      }
    }
  }

  function trimAll() {
    trimList($("news"));
    trimList($("todos"));
  }

  // Coalesced to the next frame rather than debounced on a timer. A timer that
  // is cleared and reset on every observer fire can be pushed indefinitely
  // while the layout is still settling, and the trim then runs against
  // geometry that has already been superseded — or not at all.
  var trimPending = false;
  function trimSoon() {
    if (trimPending) return;
    trimPending = true;
    requestAnimationFrame(function () {
      trimPending = false;
      trimAll();
    });
  }

  window.addEventListener("resize", trimSoon);

  // The window is not the only thing that changes the space a list has. The
  // forecast strip starts hidden and is revealed when the weather call returns,
  // which takes ~180px straight out of the cards — after the first trim had
  // already run. The result was a list trimmed to a height it no longer had,
  // with the last headline sliced through the middle. Watching the list's own
  // box catches that and every other cause (font swap, ZIP change, card count)
  // without having to enumerate them.
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(trimSoon);
    ["news", "todos"].forEach(function (id) {
      var el = $(id);
      if (el) ro.observe(el);
    });
  }

  function ageFrom(s) {
    var t = Date.parse(s);
    if (isNaN(t)) return null;
    var secs = (Date.now() - t) / 1000;
    if (secs < 60) return "now";
    if (secs < 3600) return Math.floor(secs / 60) + "m";
    if (secs < 86400) return Math.floor(secs / 3600) + "h";
    return Math.floor(secs / 86400) + "d";
  }

  // Google News appends " - Publisher" to every headline. The suffix comes off
  // the headline (the meta column is already spoken for by the age) but the
  // publisher is kept, because it is the only thing in the feed that can
  // produce a picture.
  //
  // Splitting on the LAST spaced hyphen, not the first: an earlier pattern
  // required the publisher to contain no hyphen at all, so "WSB-TV" and
  // "The Atlanta Journal-Constitution" never matched and their names stayed
  // stuck on the end of the headline.
  function splitTitle(t) {
    var s = String(t).trim();
    var m = s.match(/^(.*\S)\s+-\s+(\S.{0,48})$/);
    if (!m) return { title: s, source: "" };
    return { title: m[1].trim(), source: m[2].trim() };
  }

  // Best-effort guess at the publisher's domain. It is right more often than
  // not ("Patch" → patch.com, "FOX 5 Atlanta" → fox5atlanta.com, "WSB-TV" →
  // wsbtv.com) and wrong sometimes ("The Atlanta Journal-Constitution" is
  // ajc.com). A miss costs nothing: Google's favicon service answers 404 for
  // an unknown domain — verified, not assumed — so the image errors and the
  // monogram simply stays visible.
  function sourceDomain(name) {
    var s = name.toLowerCase().trim();
    if (/\.(com|org|net|gov|edu|tv|co\.uk)$/.test(s)) return s.replace(/\s+/g, "");
    s = s.replace(/^the\s+/, "").replace(/[^a-z0-9]/g, "");
    return s ? s + ".com" : "";
  }

  function monogram(name) {
    var words = name.replace(/[^a-zA-Z0-9 ]/g, " ").trim().split(/\s+/);
    if (!words[0]) return "?";
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  // Deterministic hue, so a given publisher keeps the same tile colour between
  // reloads instead of flickering to a new one every five minutes.
  function tileHue(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
  }

  function thumbFor(source) {
    var el = document.createElement("span");
    el.className = "thumb";
    var name = source || "News";
    el.style.background = "hsl(" + tileHue(name) + ", 42%, 42%)";
    el.textContent = monogram(name);

    // No publisher in the headline means no domain to guess. Falling back to
    // the placeholder name would resolve to news.com — a real site — and stamp
    // an unrelated logo on the story. The monogram alone is correct here.
    if (!source) return el;

    var domain = sourceDomain(name);
    if (!domain) return el;

    var img = document.createElement("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.loading = "lazy";
    img.addEventListener("load", function () { img.classList.add("ok"); });
    img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(domain);
    el.appendChild(img);
    return el;
  }

  // Local news has to be fetched in the browser, because the ZIP is only known
  // there — a build-time fetch can't know each viewer's location. Google News
  // carries genuinely local stories but sends no CORS header, so it goes
  // through rss2json, which does. Verified in a real browser: GDELT advertises
  // CORS on a HEAD request and is still blocked on the actual GET.
  function localNews(place) {
    // The comma in "Marietta, GA" makes rss2json fail the nested URL with a
    // 500 ("Cannot download this RSS feed"). "Marietta GA" is fine.
    var q = place.replace(/,/g, " ").replace(/\s+/g, " ").trim();
    var rss = "https://news.google.com/rss/search?q=" + encodeURIComponent(q)
            + "&hl=en-US&gl=US&ceid=US:en";
    return fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rss))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.status !== "ok" || !d.items || !d.items.length) throw new Error("no items");
        return d.items.slice(0, 8).map(function (it) {
          var p = splitTitle(it.title);
          return {
            title: p.title, source: p.source,
            age: ageFrom(it.pubDate),
            // Only http(s) is allowed through. The feed is third-party text,
            // and a javascript: URL in a headline's link would otherwise
            // become a click target on the page.
            link: /^https?:\/\//i.test(it.link || "") ? it.link : null
          };
        });
      });
  }

  function refreshNews() {
    if (!loc || !loc.place) return;
    localNews(loc.place)
      .then(function (items) {
        renderNews(items);
        $("news-scope").textContent = loc.place;
      })
      .catch(function () {
        // rss2json is a free third party with rate limits. If it is unavailable
        // the build-time feed from data.js stays on screen rather than a blank card.
        if (DATA && DATA.news) renderNews(DATA.news);
        $("news-scope").textContent = "";
      });
  }

  // ---- commute: drive time with live traffic (TomTom) ----
  // Everything here — the API key and both addresses — lives in this browser's
  // localStorage and nowhere else. It is deliberately NOT in the repo: the
  // dashboard is published, and a home address committed to a public page is
  // not something to undo later. It also means the key never enters git, so
  // there is nothing to leak and no referrer restriction to maintain.
  //
  // TomTom rather than Google: 50,000 tile / 2,500 non-tile requests a day on
  // the free tier with no billing account, against Google's 10,000 map loads a
  // month since the $200 credit was withdrawn in March 2025. This page reloads
  // every five minutes — about 288 route calls a day — which is comfortable
  // against 2,500 and would have consumed most of Google's monthly allowance.
  var CM_KEY = "dash.commute";
  var CM_MS = 10 * 60 * 1000;
  var DELAY_MID = 5, DELAY_HIGH = 12;   // minutes over free-flow

  function cmLoad() {
    try {
      var raw = localStorage.getItem(CM_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function cmSave(c) {
    try { localStorage.setItem(CM_KEY, JSON.stringify(c)); } catch (e) { /* not fatal */ }
  }

  var commute = cmLoad();

  function cmRender(state, data) {
    var el = $("commute");
    el.hidden = false;

    if (state === "unset") {
      el.innerHTML = '<span class="cm-lbl">Set up commute</span>';
      return;
    }
    if (state === "error") {
      el.innerHTML = '<span class="cm-lbl">Commute unavailable</span>';
      return;
    }

    var mins = Math.round(data.travel / 60);
    var delay = Math.round(data.delay / 60);
    var cls = delay >= DELAY_HIGH ? " high" : delay >= DELAY_MID ? " mid" : "";

    var html = '<span class="cm-lbl">' + esc(commute.toLabel) + '</span> ' +
               '<span class="cm-mins">' + mins + ' min</span>';
    // Only shown when there is a delay worth reporting. "+0" every morning is
    // noise, and a number that is usually zero stops being looked at.
    if (delay >= 1) {
      html += '<span class="cm-delay' + cls + '">+' + delay + '</span>';
    }
    el.innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function cmFetch() {
    if (!commute || !commute.key || !commute.from || !commute.to) {
      cmRender("unset");
      return;
    }
    var url = "https://api.tomtom.com/routing/1/calculateRoute/"
      + commute.from.lat + "," + commute.from.lon + ":"
      + commute.to.lat + "," + commute.to.lon + "/json"
      + "?key=" + encodeURIComponent(commute.key)
      + "&traffic=true&computeTravelTimeFor=all&routeType=fastest&travelMode=car";

    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (d) {
        var s = d.routes && d.routes[0] && d.routes[0].summary;
        if (!s) throw new Error("no route");
        // trafficDelayInSeconds is the delay against free flow. Falling back to
        // the difference of the two travel times covers responses where
        // computeTravelTimeFor was not honoured.
        var delay = (typeof s.trafficDelayInSeconds === "number")
          ? s.trafficDelayInSeconds
          : (s.travelTimeInSeconds - (s.noTrafficTravelTimeInSeconds || s.travelTimeInSeconds));
        cmRender("ok", { travel: s.travelTimeInSeconds, delay: Math.max(0, delay) });
      })
      .catch(function () { cmRender("error"); });
  }

  // Addresses are geocoded once, on save, and only the coordinates are kept —
  // so the typed address is not held any longer than it needs to be.
  function cmGeocode(key, q) {
    return fetch("https://api.tomtom.com/search/2/geocode/"
                 + encodeURIComponent(q) + ".json?limit=1&countrySet=US&key="
                 + encodeURIComponent(key))
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (d) {
        var hit = d.results && d.results[0];
        if (!hit) throw new Error("not found");
        return {
          lat: hit.position.lat,
          lon: hit.position.lon,
          label: (hit.address && (hit.address.municipality || hit.address.freeformAddress)) || q
        };
      });
  }
