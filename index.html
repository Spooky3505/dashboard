<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  /* Tokens — DESIGN-apple.md. Light surfaces by default. */
  :root {
    --canvas:        #ffffff;
    --parchment:     #f5f5f7;
    --card:          #ffffff;
    --hairline:      #e0e0e0;
    --ink:           #1d1d1f;
    --ink-muted:     #7a7a7a;
    --accent:        #0066cc;

    --font: system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    --pad-x: 80px;
  }

  /* Dark tiles — used after sunset. Same system, alternate surface. */
  html.night {
    --canvas:        #272729;
    --parchment:     #252527;
    --card:          #2a2a2c;
    --hairline:      rgba(255,255,255,0.08);
    --ink:           #ffffff;
    --ink-muted:     #cccccc;
    --accent:        #2997ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--parchment);
    display: grid;
    grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Hero band: light tile, edge to edge ---- */
  .hero {
    background: var(--canvas);
    padding: 56px var(--pad-x) 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  .time {
    font-size: clamp(88px, 12.5vw, 190px);
    font-weight: 600;
    line-height: 0.92;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.14;
    letter-spacing: 0.196px;
    color: var(--ink-muted);
    margin-top: 16px;
  }

  .wx { text-align: right; flex-shrink: 0; }

  .wx-temp {
    font-size: 56px;
    font-weight: 600;
    line-height: 1.07;
    letter-spacing: -0.28px;
    font-variant-numeric: tabular-nums;
  }

  .wx-cond {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    margin-top: 4px;
  }

  .wx-range {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--ink-muted);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- Card row: utility cards on parchment ---- */
  .cards {
    padding: 40px var(--pad-x) 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Cards take the slack, footer pins to the bottom. Without an explicit
       row template the implicit rows auto-size and leave dead space below. */
    grid-template-rows: 1fr auto;
    gap: 24px;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 24px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .card h2 {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .cards.single { grid-template-columns: 1fr; }

  .card ul { list-style: none; overflow: hidden; min-height: 0; }

  .card li {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    padding: 7px 0;
    border-top: 1px solid var(--hairline);
    display: flex;
    gap: 12px;
  }

  .card li:first-child { border-top: none; }

  .meta {
    color: var(--ink-muted);
    font-size: 14px;
    letter-spacing: -0.224px;
    flex-shrink: 0;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .empty { color: var(--ink-muted); font-size: 17px; letter-spacing: -0.374px; }

  /* ---- Footer ---- */
  .foot {
    grid-column: 1 / -1;
    font-size: 12px;
    line-height: 1.0;
    letter-spacing: -0.12px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    padding-top: 4px;
  }

  .stale { color: var(--accent); }

  @media (max-width: 1068px) {
    :root { --pad-x: 48px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="wx">
      <div class="wx-temp" id="wx-temp">--°</div>
      <div class="wx-cond" id="wx-cond">&nbsp;</div>
      <div class="wx-range" id="wx-range">&nbsp;</div>
    </div>
  </header>

  <main class="cards">
    <section class="card" id="todos-card">
      <h2>Todos</h2>
      <ul id="todos"><li class="empty">run refresh.sh</li></ul>
    </section>
    <section class="card">
      <h2>News</h2>
      <ul id="news"><li class="empty">run refresh.sh</li></ul>
    </section>
    <div class="foot">
      <span id="gen">no data.js</span>
      <span id="err"></span>
    </div>
  </main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.DASH_DATA || null;
  var TZ = (DATA && DATA.tz) || undefined;
  var RELOAD_MS = 5 * 60 * 1000;   // shorter than refresh.sh's 15 min, so a
                                   // reload always picks up a fresh data.js
  var WX_MS = 15 * 60 * 1000;
  var STALE_MS = 45 * 60 * 1000;

  var $ = function (id) { return document.getElementById(id); };

  // ---- clock ----
  var timeFmt = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ
  });
  var dateFmt = new Intl.DateTimeFormat("en-GB", {
    weekday: "long", day: "numeric", month: "long", timeZone: TZ
  });

  function tick() {
    var now = new Date();
    $("time").textContent = timeFmt.format(now);
    $("date").textContent = dateFmt.format(now);
  }
  tick();
  setInterval(tick, 1000);

  // ---- lists ----
  function fill(el, items, render) {
    if (!items || !items.length) {
      el.innerHTML = '<li class="empty">Nothing here</li>';
      return;
    }
    el.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      render(li, it);
      el.appendChild(li);
    });
  }

  if (DATA) {
    // The published build ships no todos at all — drop the card rather than
    // show an empty box, and let news take the full width.
    if (!DATA.todos || !DATA.todos.length) {
      var tc = $("todos-card");
      if (tc) tc.remove();
      document.querySelector(".cards").classList.add("single");
    } else {
      fill($("todos"), DATA.todos, function (li, t) {
        li.textContent = t;
      });
    }

    fill($("news"), DATA.news, function (li, n) {
      var title = document.createElement("span");
      title.textContent = n.title;
      li.appendChild(title);
      if (n.age) {
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = n.age;
        li.appendChild(meta);
      }
    });

    var gen = new Date(DATA.generated);
    var age = Date.now() - gen.getTime();
    var genEl = $("gen");
    genEl.textContent = "Updated " + new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ
    }).format(gen);
    if (age > STALE_MS) genEl.className = "stale";

    if (DATA.errors && DATA.errors.length) {
      $("err").textContent = DATA.errors.join(" · ");
      $("err").className = "stale";
    }
  }

  // ---- weather (Open-Meteo is CORS-open, so it works straight from file://) ----
  var WMO = {
    0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Rime fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
    56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Showers", 81: "Showers", 82: "Violent showers",
    85: "Snow showers", 86: "Snow showers",
    95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
  };

  function applyNight(sunrise, sunset) {
    if (!sunrise || !sunset) return;
    var now = new Date();
    var isNight = now < new Date(sunrise) || now >= new Date(sunset);
    document.documentElement.classList.toggle("night", isNight);
  }

  function weather() {
    if (!DATA || DATA.lat === undefined) return;
    var url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + encodeURIComponent(DATA.lat)
      + "&longitude=" + encodeURIComponent(DATA.lon)
      + "&current=temperature_2m,weather_code"
      + "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset"
      + "&timezone=auto&forecast_days=1";

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        $("wx-temp").textContent = Math.round(d.current.temperature_2m) + "°";
        $("wx-cond").textContent = WMO[d.current.weather_code] || "—";
        $("wx-range").textContent =
          "H " + Math.round(d.daily.temperature_2m_max[0]) + "°   " +
          "L " + Math.round(d.daily.temperature_2m_min[0]) + "°";
        applyNight(d.daily.sunrise[0], d.daily.sunset[0]);
      })
      .catch(function () {
        // offline: keep whatever is on screen rather than blanking it
        $("wx-cond").textContent = "Weather unavailable";
      });
  }
  weather();
  setInterval(weather, WX_MS);

  setTimeout(function () { location.reload(); }, RELOAD_MS);
})();
</script>
</body>
</html>
